# Attach packages when a release is published on GitHub (docs/RELEASING.md).
#
#   - the tag must be "v" + the <Version> in src/Mordor.App/Mordor.App.csproj (tools/pack-release.sh
#     refuses anything else);
#   - builds and tests the solution as CI does, then publishes and packs with Velopack:
#     OpenDejenol.Game-win-Setup.exe, OpenDejenol.Game-win-Portable.zip,
#     OpenDejenol.Game-<version>-full.nupkg, RELEASES and releases.win.json (plus a delta package
#     against the previous release, when there is one);
#   - merges the packages into that existing release with this workflow's GITHUB_TOKEN.
#     The release's pre-release checkbox is authoritative. Publishing starts the build;
#     downloads appear after it succeeds. Saving a draft or pushing a tag alone does not run it.
# Code signing is not set up (see "Sign" below and docs/RELEASING.md).
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  release:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        id: dotnet
        with:
          dotnet-version: 8.0.x

      - name: Pin the .NET 8 SDK
        run: dotnet new globaljson --sdk-version "${{ steps.dotnet.outputs.dotnet-version }}" --force

      - name: Build (Release, warnings are errors)
        run: dotnet build Mordor.sln -c Release -warnaserror

      - name: Test
        run: dotnet test Mordor.sln -c Release --no-build

      # The new published release is initially empty. Select an older completed release,
      # not GitHub's "latest" placeholder, for the optional delta package.
      - name: Previous release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          mkdir -p "$RUNNER_TEMP/release/releases"
          candidates=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '[.[] | select(
              .tag_name != env.TAG and .draft == false and
              (env.PRERELEASE == "true" or .prerelease == false) and
              any(.assets[]; .name == "releases.win.json") and
              any(.assets[]; .name | test("^OpenDejenol[.]Game-.*-full[.]nupkg$"))
            )][0].tag_name // empty')
          previous=$(printf '%s\n' "$candidates" | sed -n '1p')
          if [ -z "$previous" ]; then
            echo "no earlier completed release to make a delta package against"
          else
            echo "delta base: $previous"
            gh release download "$previous" --repo "$GITHUB_REPOSITORY" \
              --pattern 'OpenDejenol.Game-*-full.nupkg' --dir "$RUNNER_TEMP/release/releases"
          fi

      # Code signing: off. When a certificate or a SignPath project is set up, sign here (or pass
      # VPK_SIGN_PARAMS / VPK_SIGN_TEMPLATE to the Package step, which hands them to vpk) - see
      # docs/RELEASING.md, "Signing". Until then this step does nothing, and the step fails the run
      # if signing has been switched on (the repository variable SIGNING) without being filled in.
      - name: Sign (not set up)
        if: vars.SIGNING == 'true'
        shell: bash
        run: |
          echo "::error::SIGNING is true, but the signing step in release.yml is still the placeholder (docs/RELEASING.md)"
          exit 1

      - name: Package
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: sh tools/pack-release.sh "$RUNNER_TEMP/release"

      - name: Upload to the GitHub release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          version="${TAG#v}"
          set -- --repoUrl "$REPO_URL" --token "$GITHUB_TOKEN" --outputDir "$RUNNER_TEMP/release/releases" --channel win \
            --tag "$TAG" --releaseName "OpenDejenol $version" --targetCommitish "$GITHUB_SHA"
          if [ "$PRERELEASE" = "true" ]; then set -- "$@" --pre; fi
          dotnet vpk upload github "$@" --merge --skip-updates --legacyConsole

      # Also retain the packages on the workflow run's page.
      - uses: actions/upload-artifact@v7
        with:
          name: OpenDejenol-${{ github.ref_name }}
          path: ${{ runner.temp }}/release/releases/
          retention-days: 14
